<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virales - Growth Analytics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0B0D14; color: #E8E8ED; font-family: system-ui, -apple-system, sans-serif; }
    .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 1.5rem; }
  </style>
</head>
<body class="min-h-screen p-6 md:p-10">
  <div id="app" class="max-w-6xl mx-auto">
    <div class="flex items-center gap-3 mb-8">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-orange-500 to-orange-400 flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
      </div>
      <div>
        <h1 class="text-2xl font-bold">Virales</h1>
        <p class="text-xs text-gray-400">Growth Analytics Dashboard | MX</p>
      </div>
      <span id="lastUpdated" class="ml-auto text-xs text-gray-500"></span>
    </div>
    <div id="loading" class="card text-center py-20 text-gray-400">Cargando datos...</div>
    <div id="content" class="hidden space-y-6"></div>
  </div>

  <script>
    async function loadData() {
      try {
        const res = await fetch('./data.json');
        const data = await res.json();
        render(data);
      } catch(e) {
        document.getElementById('loading').innerHTML = 'Error cargando datos. Asegúrate de que data.json existe.';
      }
    }

    function fmt(n) { return n >= 1000000 ? `$${(n/1000000).toFixed(1)}M` : n >= 1000 ? `$${(n/1000).toFixed(0)}K` : `$${n.toFixed(0)}`; }

    function render(data) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('content').classList.remove('hidden');
      document.getElementById('lastUpdated').textContent = `Actualizado: ${new Date(data.generatedAt).toLocaleString('es-MX')}`;

      const kpis = data.programKpis;
      const campaigns = data.campaignResults || [];

      let html = '';

      // KPIs
      html += `<div class="grid grid-cols-2 md:grid-cols-5 gap-3">
        <div class="card text-center"><p class="text-2xl font-bold text-orange-400">${fmt(kpis.totalGmv)}</p><p class="text-xs text-gray-400">GMV Total</p><p class="text-xs text-gray-500">${kpis.totalCampaigns} campañas</p></div>
        <div class="card text-center"><p class="text-2xl font-bold text-red-400">${fmt(kpis.totalDiscount)}</p><p class="text-xs text-gray-400">Inversión Descuento</p></div>
        <div class="card text-center"><p class="text-2xl font-bold text-white">${kpis.avgRoi.toFixed(1)}x</p><p class="text-xs text-gray-400">ROI Promedio</p></div>
        <div class="card text-center"><p class="text-2xl font-bold text-white">${kpis.avgMultiplier.toFixed(1)}x</p><p class="text-xs text-gray-400">Multiplicador vs Baseline</p></div>
        <div class="card text-center"><p class="text-2xl font-bold text-purple-400">${campaigns.length}</p><p class="text-xs text-gray-400">Campañas Analizadas</p></div>
      </div>`;

      // Campaign Table
      html += `<div class="card"><h3 class="text-sm font-medium text-gray-400 uppercase tracking-wider mb-4">Detalle por Campaña</h3>
        <div class="overflow-x-auto"><table class="w-full text-sm">
        <thead><tr class="border-b border-white/10 text-xs text-gray-500">
          <th class="text-left py-2">Campaña</th><th class="text-left py-2">Fecha</th><th class="text-right py-2">GMV</th><th class="text-right py-2">Descuento</th><th class="text-right py-2">ROI</th><th class="text-right py-2">Mult.</th><th class="text-right py-2">Post %</th>
        </tr></thead><tbody>`;

      const sorted = [...campaigns].sort((a,b) => b.gmv - a.gmv);
      for (const c of sorted) {
        const roiColor = c.roi > 3 ? 'text-green-400' : c.roi > 1.5 ? 'text-orange-400' : 'text-red-400';
        const postColor = c.postDeclinePct >= -10 ? 'text-green-400' : 'text-red-400';
        html += `<tr class="border-b border-white/5 hover:bg-white/5">
          <td class="py-2 text-xs">${c.name.replace('VIRAL_DEAL_','')}</td>
          <td class="py-2 text-xs text-gray-400">${c.date}</td>
          <td class="py-2 text-xs text-right">${fmt(c.gmv)}</td>
          <td class="py-2 text-xs text-right text-gray-400">${fmt(c.discount)}</td>
          <td class="py-2 text-xs text-right ${roiColor}">${c.roi.toFixed(1)}x</td>
          <td class="py-2 text-xs text-right">${c.multiplier.toFixed(0)}x</td>
          <td class="py-2 text-xs text-right ${postColor}">${c.postDeclinePct >= 0 ? '+' : ''}${c.postDeclinePct.toFixed(0)}%</td>
        </tr>`;
      }
      html += `</tbody></table></div></div>`;

      // Insights
      const netPositive = campaigns.filter(c => c.postDeclinePct >= -10).length;
      const withDip = campaigns.filter(c => c.postDeclinePct < -10).length;
      html += `<div class="card">
        <h3 class="text-sm font-medium text-gray-400 uppercase tracking-wider mb-4">Resumen Ejecutivo</h3>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="p-4 bg-white/5 rounded-lg"><p class="text-lg font-bold text-green-400">${netPositive}</p><p class="text-xs text-gray-400">Campañas sin canibalización significativa</p></div>
          <div class="p-4 bg-white/5 rounded-lg"><p class="text-lg font-bold text-red-400">${withDip}</p><p class="text-xs text-gray-400">Campañas con dip post-viral &gt;10%</p></div>
          <div class="p-4 bg-white/5 rounded-lg"><p class="text-lg font-bold text-orange-400">${fmt(kpis.totalGmv - kpis.totalDiscount)}</p><p class="text-xs text-gray-400">GMV Neto (GMV - Descuento)</p></div>
        </div>
      </div>`;

      document.getElementById('content').innerHTML = html;
    }

    loadData();
  </script>
</body>
</html>
